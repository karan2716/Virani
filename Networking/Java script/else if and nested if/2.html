<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        a = prompt("Enter First number");
        b = prompt("Enter Second number");
        c = prompt("Enter Third number");

        if (a > b && a > c){
            document.write("First number is the largest");
        }

        else if (b > a && b > c){
            document.write("Second number is the largest");
        }

        else{
            document.write("Third number is the largest");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        a = parseInt(prompt("Enter First number"));
        b = parseInt(prompt("Enter Second number"));
        c = parseInt(prompt("Enter Third number"));
        if(a > b){
            if(a > c){
                document.write("First numbr is the largest");
            }
        }
        else if(b > a){
            if(b > c){
                document.write("Second number is the largest");
            }
        }
        else{
            document.write("Third number is the largest");
        }
    </script>
</body>
</html>

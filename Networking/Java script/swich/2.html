<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        month = prompt("Enter month name this way january");

        switch (month) {
            case "jan":
                document.write("31");
                break;

            case "fab":
                document.write("28-29");
                break;

            case "mar":
                document.write("31");
                break;

            case "apr":
                document.write("30");
                break;

            case "may":
                document.write("31");
                break;

            case "june":
                document.write("30");
                break;

            case "july":
                document.write("31");
                break;

            case "aug":
                document.write("31");
                break;

            case "sept":
                document.write("30");
                break;

            case "oct":
                document.write("31");
                break;

            case "nov":
                document.write("30");
                break;

            case "dec":
                document.write("31");
                break;
        
            default:
                document.write("Wrong input")
                break;
        }
    </script>
</body>
</html>

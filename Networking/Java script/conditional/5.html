<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        num = prompt("enter number");
        a = num % 2;

        if(a==0){
            document.write("Number is Even");
        }

        else{
            document.write("Number is odd");
        }
    </script>
</body>
</html>

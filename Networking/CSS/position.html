<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            
        }
        .header{
            top:0;
            left:0;
            width: 100%;
            background-color: peru;
            color: white;
            padding: 20px;
            text-align: center;
            z-index: 10;
            position: fixed;
        }

        body{
            height: 1500px;
            margin: 0px;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }

        .container{
            margin-top: 100px;
            padding: 30px;
        }

        .title{
            top:70px;
            background-color: blueviolet;
            padding: 15px;
            text-align: center;
            position: sticky
        }

        .product{
            width: 300px;
            margin: auto;
            border: solid 2px black;
            text-align: center;
            padding: 30px;
            position: relative;
        }
        .sale{
            top:10px;
            right:10px;
            background-color:red;
            color:white;
            padding:5px 10px;
            border-radius:6px;
            position:absolute;
        }
        .help{
            right: 20px;
            bottom: 20px;
            background-color: green;
            color: white;
            padding: 15px;
            border-radius: 50%;
            position: fixed;
        }
        .price{
            left: 20px;
            color: green;
            font-size: 25px;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>My shoping website</h1>
    </div>

    <div class="container">
        <h2 class="title">Product Section</h2>

        <div class="product">
            <div class="sale">
                sale
            </div>
            <h2>Smartwatch</h2>
            <p>Fetures</p>
            <div class="price">Price:₹120</div><br>
            <button>Buy Now</button>
        </div>
        <div class="help">
            Help
        </div>
    </div>
</body>
</html>
